name: Build ScreenMazer

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build screen saver
        run: |
          xcodebuild \
            -project ScreenMazer.xcodeproj \
            -target ScreenMazer \
            -configuration Release \
            -sdk macosx \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/${{ matrix.arch }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Validate and package
        run: |
          SAVER="build/${{ matrix.arch }}/ScreenMazer.saver"
          EXECUTABLE="$SAVER/Contents/MacOS/ScreenMazer"
          ARCH="${{ matrix.arch }}"

          test -d "$SAVER"
          test "$(lipo -archs "$EXECUTABLE")" = "$ARCH"
          codesign --verify --deep --strict --verbose=2 "$SAVER"
          ditto -c -k --sequesterRsrc --keepParent \
            "$SAVER" "ScreenMazer-${ARCH}.saver.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ScreenMazer-${{ matrix.arch }}
          path: ScreenMazer-${{ matrix.arch }}.saver.zip

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.saver.zip
